# --- Master Configuration for the Backtesting Framework ---

run_mode: 'train_optimize_and_backtest' # 'train', 'optimize', 'backtest', or 'train_optimize_and_backtest'


# 1. Data Agent Configuration
data_path: 'ml_backtester/data/EURUSD_m15_2022_2025.parquet'

# 2. Feature Engineering Configuration
feature_engineering:
  indicators:
    - {name: 'ema', params: {length: 200}}
    - {name: 'macd'}
    - {name: 'rsi'}
    - {name: 'stoch'}
    - {name: 'atr'}
    - {name: 'bband'}
    - {name: 'obv'}
    - {name: 'cci'}
    - {name: 'adx'}
    - {name: 'wpr'}
    - {name: 'ichimoku'}
    - {name: 'mfi'}
    - {name: 'cmf'}
    - {name: 'kc'}
    - {name: 'psar'}
    - {name: 'stochrsi'}
  scaling: null # 'standard' or null

# 3. Strategy Configuration
strategy:
  name:
    - 'cnn_lstm'
    - 'triple_threat'
    - 'bounce_back'
  # Strategy-specific parameters would go here if needed
  # params:
  #   ema_period: 200

# 4. Modeling Configuration
modeling:
  model_type: 'cnn_lstm'
  model_save_path: 'ml_backtester/models/trained_model_pytorch'
  use_enhanced_model: true
  look_back: 96
  epochs: 100
  batch_size: 32

# 5. Optimization Configuration
optimization:
  enabled: true # Set to true to run optimization
  n_trials: 50
  objective_metric: 'sharpe_ratio' # sharpe_ratio, sortino_ratio, calmar_ratio
  params_by_strategy:
    cnn_lstm:
      sl_atr_multiplier: {type: 'float', low: 1.0, high: 5.0}
      tp_atr_multiplier: {type: 'float', low: 1.0, high: 5.0}
      trailing_stop_atr_multiplier: {type: 'float', low: 1.0, high: 4.0}
    triple_threat:
      ema_period: {type: 'int', low: 150, high: 250}
      stoch_oversold: {type: 'int', low: 10, high: 30}
      stoch_overbought: {type: 'int', low: 70, high: 90}
      sl_atr_multiplier: {type: 'float', low: 1.0, high: 5.0}
      tp_atr_multiplier: {type: 'float', low: 1.0, high: 5.0}
    bounce_back:
      fib_window: {type: 'int', low: 200, high: 300}
      rsi_period: {type: 'int', low: 10, high: 20}
      sl_atr_multiplier: {type: 'float', low: 1.0, high: 5.0}
      tp_atr_multiplier: {type: 'float', low: 1.0, high: 5.0}
  
  ml_params: # New section for ML hyperparameter tuning
    learning_rate: {type: 'float', low: 0.0001, high: 0.01, log: true}
    num_layers: {type: 'int', low: 1, high: 3}
    hidden_size: {type: 'int', low: 32, high: 128}
    dropout: {type: 'float', low: 0.1, high: 0.5}

# 6. Risk Management Configuration
risk_management:
  risk_per_trade: 0.01
  sl_atr_multiplier: 2.0
  tp_atr_multiplier: 3.0
  trailing_stop:
    enabled: true
    atr_multiplier: 1.5

# 7. Execution Configuration
execution:
  slippage_percent: 0.0005

# 8. Backtesting Configuration
backtesting:
  mode: 'iterative'
  initial_capital: 100000

# 9. Walk-Forward Configuration
walk_forward:
  n_splits: 5 # Number of folds for walk-forward validation

# 10. Analytics Configuration
analytics:
  report_path: 'ml_backtester/reports'

# 10. Export Configuration
export:
  enabled: true
  path: 'ml_backtester/exports'
  formats: ['mt5', 'pinescript'] # Supported formats: 'mt5', 'pinescript'

# 10. Logging Configuration
logging:
  level: 'INFO' # DEBUG, INFO, WARNING, ERROR